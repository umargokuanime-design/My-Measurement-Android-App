name: Build My Measurement APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Normalize app logo image
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert app/src/main/res/drawable-nodpi/my_measurement_logo.png PNG32:/tmp/my_measurement_logo.png
          cp /tmp/my_measurement_logo.png app/src/main/res/drawable-nodpi/my_measurement_logo.png

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMeasurement-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release Android App Bundle
        run: gradle bundleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MyMeasurement-release-AAB-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
